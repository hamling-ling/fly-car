[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flycar"
version = "0.0.0"
description = "ショウジョウバエのコネクトームで走る車の車輪則と画角"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flycar"]

[tool.setuptools.package-data]
flycar = ["color_thresholds.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
